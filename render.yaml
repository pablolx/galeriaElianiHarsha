databases:
  - name: eliani-harsha-db
    databaseName: eliani_harsha
    user: eliani_harsha
    plan: basic-256mb

services:
  - type: web
    name: eliani-harsha
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eliani-harsha-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: SECURE_SSL_REDIRECT
        value: "1"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: ALLOWED_HOSTS
        value: eliani-harsha.onrender.com
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: CONTACT_EMAIL
        sync: false
      - key: INSTAGRAM_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
    disk:
      name: eliani-media
      mountPath: /var/data/media
      sizeGB: 1
