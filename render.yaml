databases:
  - name: eliani-harsha-db
    databaseName: eliani_harsha
    user: eliani_harsha
    plan: basic-256mb

services:
  - type: web
    name: eliani-harsha
    runtime: docker
    plan: starter
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eliani-harsha-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: SECURE_SSL_REDIRECT
        value: "1"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: CONTACT_EMAIL
        value: pablo.pinheiro@gmail.com
    disk:
      name: eliani-media
      mountPath: /var/data/media
      sizeGB: 1
